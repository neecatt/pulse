name: Image

# Publishes the container image:
#   push to main      -> :edge (and :sha-<commit>)
#   tag v1.2.3        -> :1.2.3, :1.2, :1 and :latest
#   tag v1.2.3-rc.1   -> :1.2.3-rc.1 only (pre-releases never become latest)
# to Docker Hub (vars.DOCKERHUB_IMAGE, default neecat/pulse) when the
# DOCKERHUB_TOKEN secret is set, and always to GHCR as a mirror.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'neecat/pulse' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.HAS_DOCKERHUB == 'true' && format('docker.io/{0}', env.DOCKERHUB_IMAGE) || '' }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ env.IS_RELEASE }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keep the Docker Hub page's description in sync with the README.
      - if: env.HAS_DOCKERHUB == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Self-hosted monitor for Slurm jobs and training runs, with push alerts.
          readme-filepath: ./README.md
