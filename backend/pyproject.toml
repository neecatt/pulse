[project]
name = "pulse-backend"
version = "0.1.3"
description = "API, Slurm poller and push notifier for the Pulse HPC monitor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "asyncssh>=2.18",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "pywebpush>=2.0",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32",
  "webauthn>=3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "tensorboardX>=2.6",  # writes real event files for the reader's tests
  "types-PyYAML>=6.0",
]

[project.scripts]
pulse = "pulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Configuration and secrets come from pulse.config.Settings (environment / .env).
"os.environ".msg = "Read configuration through pulse.config.Settings."
"os.getenv".msg = "Read configuration through pulse.config.Settings."

[tool.ruff.lint.per-file-ignores]
# Runs on cluster login nodes with old Pythons: stays Python 3.6 compatible.
"src/pulse/agent/pulse_agent.py" = ["UP", "SIM115", "RUF001", "TID251"]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid"]
ignore_missing_imports = true
